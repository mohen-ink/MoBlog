name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_PORT:?Missing SSH_PORT}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"

          DEPLOY_PATH="${DEPLOY_PATH:-/opt/1panel/www/sites/blog.hoyo.ltd/index}"

          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 ))
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          if [[ ! "$DEPLOY_PATH" =~ ^(/[a-zA-Z0-9_-][a-zA-Z0-9._-]*)+$ ]]; then
            printf '%s\n' 'Invalid DEPLOY_PATH: use an absolute path without spaces or dot segments.' >&2
            exit 1
          fi
          [[ "$RELEASE_ID" =~ ^[a-zA-Z0-9-]+$ ]]

          test -s dist/index.html
          test -s dist/pagefind/pagefind.js

          ssh_dir="$(mktemp -d "$RUNNER_TEMP/moblog-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          umask 077

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS

          SSH_ARGS=(
            -i "$ssh_dir/deploy_key"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
          )

          ssh "${SSH_ARGS[@]}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases' && mkdir '$DEPLOY_PATH/releases/$RELEASE_ID'"

          command -v rsync >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y rsync
          }

          printf -v SSH_COMMAND '%q ' ssh "${SSH_ARGS[@]}"

          rsync -az \
            --chmod=D755,F644 \
            -e "$SSH_COMMAND" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/"

          ssh "${SSH_ARGS[@]}" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail

          deploy_path="$1"
          release_id="$2"
          release_path="$deploy_path/releases/$release_id"

          test -s "$release_path/index.html"
          test -s "$release_path/pagefind/pagefind.js"

          if [ -e "$deploy_path/current" ] && [ ! -L "$deploy_path/current" ]; then
            printf '%s\n' 'Refusing to replace current: it is not a symlink.' >&2
            exit 1
          fi

          ln -s "releases/$release_id" \
            "$deploy_path/.current-$release_id"

          mv -Tf "$deploy_path/.current-$release_id" \
            "$deploy_path/current"
          REMOTE
